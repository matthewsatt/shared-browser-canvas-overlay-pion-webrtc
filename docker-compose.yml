services:
  collab-browser:
    build: .
    ports:
      # Web UI and API. On a public server behind Caddy, set
      # HTTP_PUBLISH=127.0.0.1:8080 so plain HTTP isn't reachable from outside.
      - "${HTTP_PUBLISH:-8080}:8080"
      - "50000-50100:50000-50100/udp"   # WebRTC video
    environment:
      # Address viewers use to reach this machine. 127.0.0.1 works when you
      # open http://localhost:8080 on the same computer; use your LAN or
      # public IP to let others join.
      WEBRTC_PUBLIC_IPS: ${PUBLIC_IP:-127.0.0.1}
      # Required to create sessions when set. Leave unset for local use.
      API_TOKEN: ${API_TOKEN:-}
      # Your apps that embed the SDK, and the pages the shared browser may
      # show. Both optional locally; see .env.example.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ALLOWED_URL_PREFIXES: ${ALLOWED_URL_PREFIXES:-}
      MAX_SESSIONS: ${MAX_SESSIONS:-10}
      # ALLOW_PRIVATE_NETWORKS: "true"   # dev only: let the browser open internal/localhost sites
    # Hardening. The browser renders pages that take patient data and card
    # numbers, so: Chromium's own sandbox stays on (the seccomp profile is
    # Docker's default plus exactly the calls the sandbox needs), the
    # container has no capabilities and can't gain any, the filesystem is
    # read-only, and /tmp (browser profiles: cookies, cached pages) lives in
    # memory and never touches the disk.
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/chromium-seccomp.json
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    shm_size: 1gb
    pids_limit: 32768
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    stop_grace_period: 20s
    restart: unless-stopped

  # HTTPS for a public server. Only starts with --profile https (or
  # COMPOSE_PROFILES=https in .env). See .env.example.
  caddy:
    image: caddy:2
    profiles: ["https"]
    ports:
      - "80:80"         # ACME challenge + redirect to HTTPS
      - "443:443"
      - "443:443/udp"   # HTTP/3 (optional)
    environment:
      DOMAIN: ${DOMAIN:-}
    # Fail with a clear message instead of a Caddyfile parse error.
    command:
      - sh
      - -c
      - 'test -n "$$DOMAIN" || { echo "DOMAIN is not set (see .env.example)" >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates; keep this volume to avoid Let's Encrypt rate limits
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    depends_on:
      collab-browser:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
